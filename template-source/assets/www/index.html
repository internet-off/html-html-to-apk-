<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML App Template v2</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 15px; }
    button { background: #3b82f6; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Активный движок WebView:</h3>
    <p id="wv-info">Определение...</p>
    <button onclick="if(window.AndroidBridge) AndroidBridge.openSystemWebViewPicker()">⚙️ Сменить системный WebView (Bromite / Chrome)</button>
  </div>
  <div class="card">
    <h3>Установленные браузеры на телефоне:</h3>
    <select id="browser-list"><option value="">Встроенный WebView (по умолчанию)</option></select>
    <button onclick="applyBrowser()">Применить выбор</button>
  </div>
  <script>
    if (window.AndroidBridge) {
      document.getElementById('wv-info').innerText = AndroidBridge.getCurrentWebViewInfo();
      const list = JSON.parse(AndroidBridge.getInstalledBrowsers());
      const sel = document.getElementById('browser-list');
      list.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.pkg;
        opt.innerText = b.name + ' (' + b.pkg + ')';
        sel.appendChild(opt);
      });
    }
    function applyBrowser() {
      if (window.AndroidBridge) {
        AndroidBridge.setPreferredBrowser(document.getElementById('browser-list').value);
        alert('Режим открытия ссылок обновлён!');
      }
    }
  </script>
</body>
</html>
